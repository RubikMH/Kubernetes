---
################################################################################
# Kubernetes Cluster Reset Playbook
# 
# WARNING: This playbook will completely remove Kubernetes from all nodes
# Use this to clean up and start fresh
#
# Usage: ansible-playbook -i inventory.ini playbook-reset.yml
################################################################################

- name: Reset Kubernetes Cluster
  hosts: k8s_cluster
  become: yes
  tasks:

    # =========================================================================
    # WARNING AND CONFIRMATION
    # =========================================================================
    - name: Display warning message
      debug:
        msg:
          - "╔════════════════════════════════════════════════════════════════╗"
          - "║                      ⚠️  WARNING ⚠️                            ║"
          - "╚════════════════════════════════════════════════════════════════╝"
          - ""
          - "This will COMPLETELY REMOVE Kubernetes from all nodes:"
          - "  • All pods and containers will be deleted"
          - "  • All cluster data will be lost"
          - "  • All configurations will be removed"
          - ""
          - "Nodes affected:"
          - "  Master: {{ groups['master'] | join(', ') }}"
          - "  Workers: {{ groups['workers'] | join(', ') }}"
          - ""
          - "The playbook will pause for 10 seconds..."
          - "Press Ctrl+C and then A to abort if you want to cancel"
          - ""
      run_once: yes
      delegate_to: localhost

    - name: Pause before proceeding with reset
      pause:
        seconds: 10
      run_once: yes

    # =========================================================================
    # TASK 1: Drain Nodes (Master Only)
    # =========================================================================
    - name: Drain worker nodes from master
      command: "kubectl drain {{ item }} --delete-emptydir-data --force --ignore-daemonsets"
      loop: "{{ groups['workers'] }}"
      when: inventory_hostname in groups['master']
      ignore_errors: yes
      tags: [drain]

    - name: Delete worker nodes from cluster
      command: "kubectl delete node {{ item }}"
      loop: "{{ groups['workers'] }}"
      when: inventory_hostname in groups['master']
      ignore_errors: yes
      tags: [drain]

    # =========================================================================
    # TASK 2: Stop Kubernetes Services
    # =========================================================================
    - name: Stop kubelet service
      systemd:
        name: kubelet
        state: stopped
      ignore_errors: yes
      tags: [stop]

    - name: Stop containerd service
      systemd:
        name: containerd
        state: stopped
      ignore_errors: yes
      tags: [stop]

    # =========================================================================
    # TASK 3: Reset kubeadm
    # =========================================================================
    - name: Reset kubeadm
      command: kubeadm reset -f
      register: kubeadm_reset
      ignore_errors: yes
      tags: [reset]

    - name: Display kubeadm reset output
      debug:
        var: kubeadm_reset.stdout_lines
      tags: [reset]

    # =========================================================================
    # TASK 4: Remove Kubernetes Packages (Optional)
    # =========================================================================
    - name: Unhold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubeadm
        - kubectl
      ignore_errors: yes
      tags: [remove, packages]

    - name: Remove Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: absent
        purge: yes
      ignore_errors: yes
      tags: [remove, packages]

    - name: Remove containerd package
      apt:
        name: containerd.io
        state: absent
        purge: yes
      ignore_errors: yes
      tags: [remove, packages]

    # =========================================================================
    # TASK 5: Clean Up Configuration Files
    # =========================================================================
    - name: Remove Kubernetes configuration directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
        - /etc/cni
        - /var/lib/cni
        - /opt/cni
        - /run/flannel
        - /etc/containerd
        - /var/lib/containerd
      tags: [cleanup]

    - name: Remove kubectl configuration from users
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.kube
        - /home/*/.kube
      tags: [cleanup]

    # =========================================================================
    # TASK 6: Clean Up Network Configuration
    # =========================================================================
    - name: Remove CNI network configuration
      file:
        path: /etc/cni/net.d
        state: absent
      tags: [cleanup, network]

    - name: Flush iptables rules
      shell: |
        iptables -F
        iptables -t nat -F
        iptables -t mangle -F
        iptables -X
      ignore_errors: yes
      tags: [cleanup, network]

    - name: Remove virtual network interfaces
      shell: |
        ip link delete cni0 2>/dev/null || true
        ip link delete flannel.1 2>/dev/null || true
        ip link delete docker0 2>/dev/null || true
      ignore_errors: yes
      tags: [cleanup, network]

    # =========================================================================
    # TASK 7: Clean Up System Configuration
    # =========================================================================
    - name: Remove Kubernetes modules configuration
      file:
        path: /etc/modules-load.d/k8s.conf
        state: absent
      tags: [cleanup]

    - name: Remove Kubernetes sysctl configuration
      file:
        path: /etc/sysctl.d/k8s.conf
        state: absent
      tags: [cleanup]

    - name: Reload sysctl
      command: sysctl --system
      ignore_errors: yes
      tags: [cleanup]

    # =========================================================================
    # TASK 8: Remove Repository Configuration
    # =========================================================================
    - name: Remove Kubernetes apt repository
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent
      tags: [cleanup, repos]

    - name: Remove Docker apt repository
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
      tags: [cleanup, repos]

    - name: Remove apt keyrings
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /etc/apt/keyrings/docker.gpg
      tags: [cleanup, repos]

    - name: Update apt cache
      apt:
        update_cache: yes
      ignore_errors: yes
      tags: [cleanup, repos]

    # =========================================================================
    # TASK 9: Re-enable Swap (Optional)
    # =========================================================================
    - name: Uncomment swap entries in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^#(.+\s+swap\s+.*)$'
        replace: '\1'
      ignore_errors: yes
      tags: [cleanup, swap]

    - name: Enable swap
      command: swapon -a
      ignore_errors: yes
      tags: [cleanup, swap]

    # =========================================================================
    # TASK 10: Reboot (Optional)
    # =========================================================================
    - name: Check if reboot is recommended
      debug:
        msg:
          - "Kubernetes has been removed from this node"
          - "A reboot is recommended to ensure all changes take effect"
          - "To reboot all nodes, run with --tags=reboot"
      tags: [verify]

    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
      when: ansible_reboot | default(false)
      tags: [reboot, never]

    # =========================================================================
    # TASK 11: Display Reset Summary
    # =========================================================================
    - name: Display reset summary
      debug:
        msg:
          - "=== KUBERNETES RESET COMPLETE ==="
          - "Node: {{ inventory_hostname }}"
          - ""
          - "Removed:"
          - "  ✓ All Kubernetes components"
          - "  ✓ All configuration files"
          - "  ✓ All network configurations"
          - "  ✓ All container data"
          - ""
          - "The node is now clean and ready for fresh installation"
          - ""
          - "To reinstall Kubernetes, run:"
          - "  ansible-playbook -i inventory.ini site.yml"
      tags: [verify]

################################################################################
# FINAL STATUS
################################################################################
- name: Display final reset status
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display completion message
      debug:
        msg:
          - ""
          - "╔════════════════════════════════════════════════════════════════╗"
          - "║        Kubernetes Cluster Reset Complete! ✓                   ║"
          - "╚════════════════════════════════════════════════════════════════╝"
          - ""
          - "All nodes have been cleaned:"
          - "  Master: {{ groups['master'] | join(', ') }}"
          - "  Workers: {{ groups['workers'] | join(', ') }}"
          - ""
          - "To reinstall the cluster:"
          - "  ansible-playbook -i inventory.ini site.yml"
          - ""
          - "To reboot all nodes:"
          - "  ansible-playbook -i inventory.ini playbook-reset.yml --tags=reboot"
          - ""