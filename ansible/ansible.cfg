[defaults]
# Inventory file location
inventory = inventory.ini

# Disable host key checking for easier setup
host_key_checking = False

# Number of parallel processes
forks = 10

# Timeout for gathering facts
gather_timeout = 30

# Display output format
stdout_callback = yaml

# Show task timing
callbacks_enabled = profile_tasks, timer

# Retry files location (disabled)
retry_files_enabled = False

# Log file location
log_path = ./ansible.log

# Roles path
roles_path = ./roles

# Enable pipelining for better performance
pipelining = True

[privilege_escalation]
# Enable privilege escalation by default
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH timeout
timeout = 30

# Use control persist for faster connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no

# Enable pipelining
pipelining = True

[inventory]
# Enable ini and yaml inventory plugins
enable_plugins = ini, yaml