# Ansible Inventory for Kubernetes Cluster
# 
# This file defines all nodes in your Kubernetes cluster
# Update the IP addresses and hostnames according to your environment

[master]
# Control plane node - only one master in this setup
control-plane ansible_host=x.x.x.x ansible_user=root

[workers]
# Worker nodes - add as many as you need
worker1 ansible_host=x.x.x.x ansible_user=root

[k8s_cluster:children]
# This group includes all Kubernetes nodes
master
workers

[all:vars]
# Global variables for all hosts
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# If using SSH key authentication (recommended)
# ansible_ssh_private_key_file=~/.ssh/id_rsa

# If using password authentication (less secure)
# ansible_ssh_pass=your_password
# ansible_become_pass=your_sudo_password
