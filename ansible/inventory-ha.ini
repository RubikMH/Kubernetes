# Ansible Inventory for HA Kubernetes Cluster
# 
# This file defines all nodes in your High Availability Kubernetes cluster
# It includes the 'haproxy' group which is required for site-ha.yml

[haproxy]
# HAProxy Load Balancer Node(s)
# You can refer to an existing node or a new dedicated node
# Example: haproxy1 ansible_host=x.x.x.x ansible_user=root
# For testing (not recommended for production), you can co-locate with a master:
control-plane

[master]
# Control plane nodes - for HA, use 3 or more
control-plane ansible_host=x.x.x.x ansible_user=root
# master2 ansible_host=...
# master3 ansible_host=...

[workers]
# Worker nodes
worker1 ansible_host=x.x.x.x ansible_user=root

[k8s_cluster:children]
# This group includes all Kubernetes nodes
master
workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# Global variables for all hosts
